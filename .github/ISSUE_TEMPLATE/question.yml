name: Question
description: Setup help or general question
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before asking — please check the [Troubleshooting section](https://github.com/duskycuh/server_control#troubleshooting)
        in the README. Most setup problems are covered there.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2

  - type: input
    id: server
    attributes:
      label: Server OS
      placeholder: Ubuntu 24.04 / Debian 12

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
